<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta Obstétrica</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(135deg,#ffe7f0,#e5f4ff);color:#263238;padding:20px}
.app{max-width:820px;margin:auto;background:#fff;border-radius:28px;padding:22px;box-shadow:0 15px 45px #0002}
h1{text-align:center;margin:0}.sub{text-align:center;color:#68757d;margin:5px 0 18px}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{background:#f4f7fa;padding:8px 13px;border-radius:999px;font-weight:700}
.game{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:center;margin-top:20px}
.wheelWrap{position:relative;width:280px;margin:auto}.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:30px;z-index:3}
#wheel{width:280px;height:280px;border-radius:50%;border:8px solid #fff;box-shadow:0 7px 22px #0003;transition:transform 3.2s cubic-bezier(.12,.72,.18,1)}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.center span{background:white;border-radius:50%;width:62px;height:62px;display:grid;place-items:center;font-size:25px;box-shadow:0 2px 8px #0002}
#spin{display:block;margin:16px auto 0;border:0;border-radius:14px;padding:12px 25px;background:#4f8db0;color:white;font-size:16px;font-weight:800;cursor:pointer}#spin:disabled{opacity:.5}
.card{background:#f8fbfd;border:1px solid #d9e3e8;border-radius:20px;padding:20px;min-height:250px}
#category{font-size:13px;font-weight:800;color:#4f8db0;text-transform:uppercase;letter-spacing:.08em}#challenge{font-size:21px;font-weight:750;margin:12px 0 18px}
.answers{display:grid;gap:9px}.ans{padding:11px;border:1px solid #cfdbe2;border-radius:12px;background:white;text-align:left;cursor:pointer;font-weight:650}.ans:hover{background:#eef7fb}.ans:disabled{cursor:default}
#feedback{min-height:25px;font-weight:800;margin-top:14px}.next{display:none;margin-top:12px;border:0;border-radius:12px;padding:10px 18px;background:#263238;color:white;font-weight:700;cursor:pointer}
@media(max-width:680px){.game{grid-template-columns:1fr}.wheelWrap{width:240px}#wheel{width:240px;height:240px}}
</style>
</head>
<body>
<div class="app">
<h1>🎡 Ruleta Obstétrica</h1>
<div class="sub">Gira, responde y consigue una racha de campeona 😈</div>
<div class="stats">
<span class="pill">⭐ <b id="score">0</b></span><span class="pill">❤️ <b id="lives">3</b></span>
<span class="pill">🔥 Racha: <b id="streak">0</b></span><span class="pill">🏆 Nivel: <b id="level">1</b></span>
</div>
<div class="game">
<div>
<div class="wheelWrap"><div class="pointer">🔻</div><canvas id="wheel" width="280" height="280"></canvas><div class="center"><span>🎡</span></div></div>
<button id="spin">🎯 GIRAR RULETA</button>
</div>
<div class="card">
<div id="category">¡Gira la ruleta!</div>
<div id="challenge">Te espera un reto obstétrico.</div>
<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button class="next" id="next">➡️ Siguiente reto</button>
</div>
</div>
</div>
<script>
const sectors=[
["🧠 PREGUNTA","¿Cuál es una de las funciones principales de la placenta?","Transportar oxígeno y nutrientes al feto","Producir los huesos del feto","Cerrar el cuello uterino"],
["🩺 INSTRUMENTO","¿Qué instrumento se utiliza para auscultar la frecuencia cardíaca fetal?","Doppler fetal","Otoscopio","Glucómetro"],
["👶 CASO EXPRESS","Una gestante llega con contracciones regulares. ¿Qué dato ayuda a valorar la evolución del trabajo de parto?","Dilatación cervical","Color de ojos","Talla del acompañante"],
["🚨 ¿QUÉ HARÍAS?","Ante una emergencia obstétrica, una prioridad inicial es:","Valorar rápidamente a la paciente y activar ayuda según el protocolo","Esperar a que se resuelva sola","Salir de la sala"],
["⚡ 10 SEGUNDOS","¿Cuál de estos signos puede acompañar al trabajo de parto?","Contracciones uterinas regulares","Dolor de oído","Tos aislada"],
["🎁 SORPRESA","¿Qué documento es importante revisar para conocer antecedentes y evolución de la atención?","Historia clínica","Recibo de luz","Lista de compras"]
];
const colors=["#ffd6e5","#d7efff","#e5ddff","#d9f4e5","#fff0c7","#ffe0cf"];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),N=sectors.length,arc=Math.PI*2/N;
let rotation=0,score=0,lives=3,streak=0,level=1,current=null,answered=false,spinning=false;
function drawWheel(){ctx.clearRect(0,0,280,280);for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(140,140);ctx.arc(140,140,132,i*arc, (i+1)*arc);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(140,140);ctx.rotate(i*arc+arc/2);ctx.fillStyle="#263238";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(sectors[i][0].split(" ")[1],83,4);ctx.restore()}}
drawWheel();
function update(){document.getElementById("score").textContent=score;document.getElementById("lives").textContent=lives;document.getElementById("streak").textContent=streak;document.getElementById("level").textContent=level}
function spin(){if(spinning||lives<=0)return;spinning=true;answered=false;document.getElementById("spin").disabled=true;document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";let idx=Math.floor(Math.random()*N);let target=360*5+(360-(idx*360/N+360/N/2));rotation+=target;canvas.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{current=idx;showChallenge();spinning=false;},3250)}
function showChallenge(){let s=sectors[current];document.getElementById("category").textContent=s[0];document.getElementById("challenge").textContent=s[1];let arr=[s[2],s[3],["Valorar el caso clínico"][0]];if(current===0)arr=[s[2],s[3],s[4]];if(current===1)arr=[s[2],s[3],s[4]];if(current===2)arr=[s[2],s[3],s[4]];if(current===3)arr=[s[2],s[3],s[4]];if(current===4)arr=[s[2],s[3],s[4]];if(current===5)arr=[s[2],s[3],s[4]];arr=arr.sort(()=>Math.random()-.5);let box=document.getElementById("answers");box.innerHTML="";arr.forEach(a=>{let b=document.createElement("button");b.className="ans";b.textContent=a;b.onclick=()=>answer(a,b);box.appendChild(b)});document.getElementById("spin").disabled=true}
function answer(a,b){if(answered)return;answered=true;document.querySelectorAll(".ans").forEach(x=>x.disabled=true);let correct=sectors[current][2];if(a===correct){let pts=10+streak*5;score+=pts;streak++;if(streak%3===0)level++;b.style.background="#dff6e7";document.getElementById("feedback").textContent=`✅ ¡Correcto! +${pts} puntos 🔥`;document.getElementById("next").style.display="inline-block"}else{lives--;streak=0;b.style.background="#ffe1e1";document.getElementById("feedback").textContent=`❌ No esta vez. La respuesta correcta era: ${correct}`;document.getElementById("next").style.display="inline-block";if(lives<=0){document.getElementById("feedback").textContent+=" · 💀 ¡Sin vidas! Pulsa reiniciar.";document.getElementById("next").style.display="none";document.getElementById("spin").disabled=true}}update()}
document.getElementById("spin").onclick=spin;document.getElementById("next").onclick=()=>{document.getElementById("category").textContent="¡Gira la ruleta!";document.getElementById("challenge").textContent="¿Podrás mantener la racha?";document.getElementById("answers").innerHTML="";document.getElementById("feedback").textContent="";document.getElementById("next").style.display="none";document.getElementById("spin").disabled=false};update();
</script>
</body>
</html>
